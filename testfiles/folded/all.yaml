---
# Doc 1: Literal Block Scalar with Default Clip (|)
# Expectation: Newlines preserved verbatim; exactly 1 trailing newline.
doc_literal_clip: |
  foo
  bar

---
# Doc 2: Folded Block Scalar with Default Clip (>)
# Expectation: Single newlines converted to spaces; exactly 1 trailing newline.
doc_folded_clip: >
  fizz
  buzz

---
# Doc 3: Literal Block Scalar with Strip Chomping (|-)
# Expectation: Newlines preserved verbatim; NO trailing newline at the end.
doc_literal_strip: |-
  bazz
  qux

---
# Doc 4: Literal Block Scalar with Keep Chomping (|+)
# Expectation: Newlines preserved verbatim; ALL trailing newlines/blank lines kept.
doc_literal_keep: |+
  corge
  grault


---
# Doc 5: Folded Block Scalar with Strip Chomping (>-)
# Expectation: Folded into single space; NO trailing newline at the end.
doc_folded_strip: >-
  foo
  bar

---
# Doc 6: Folded Block Scalar with Keep Chomping (>+)
# Expectation: Folded into single space; ALL trailing blank lines kept.
doc_folded_keep: >+
  fizz
  buzz


---
# Doc 7: Explicit Indentation Indicator (|2)
# Expectation: Base indent is forced to 2 spaces beyond parent key column.
# The 2 leading spaces on each line are treated as literal string content.
doc_explicit_indent: |2
    leading spaces are content
    second line
